name: frontend

on:
  push:
    branches: [main]
    paths: ["code/frontend/**", ".github/workflows/frontend.yml"]
  pull_request:
    paths: ["code/frontend/**", ".github/workflows/frontend.yml"]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: code/frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: code/frontend/package-lock.json

      - run: npm ci
      - run: npm run build

      - name: Build image
        run: docker build -t workload-frontend:${{ github.sha }} .

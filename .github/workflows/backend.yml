name: backend

on:
  push:
    branches: [main]
    paths: ["code/**", "pyproject.toml", ".github/workflows/backend.yml"]
  pull_request:
    paths: ["code/**", "pyproject.toml", ".github/workflows/backend.yml"]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: code/requirements*.txt

      - name: Install
        run: pip install -r code/requirements.txt -r code/requirements-dev.txt

      - name: Test
        run: pytest -q

      - name: Build image
        run: docker build -t workload-api:${{ github.sha }} code

      - name: Smoke-test image
        run: |
          docker run -d --rm --name api -p 8000:8000 \
            -e SUPABASE_URL=http://supabase.invalid -e SUPABASE_SERVICE_KEY=k \
            workload-api:${{ github.sha }}
          for i in $(seq 1 15); do curl -sf localhost:8000/health && break; sleep 1; done
          docker stop api

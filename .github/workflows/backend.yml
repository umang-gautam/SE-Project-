name: backend

on:
  push:
    branches: [main]
    paths: ["code/backend/**", "pyproject.toml", ".github/workflows/backend.yml"]
  pull_request:
    paths: ["code/backend/**", "pyproject.toml", ".github/workflows/backend.yml"]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: http://supabase.invalid
      SUPABASE_KEY: ci-dummy
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: code/backend/requirements.txt

      - name: Install
        run: pip install -r code/backend/requirements.txt

      - name: Test
        run: pytest -q

      - name: Build image
        run: docker build -t workload-backend:${{ github.sha }} code/backend

      - name: Smoke-test image
        run: |
          docker run -d --rm --name backend -p 8000:8000 \
            -e SUPABASE_URL=$SUPABASE_URL -e SUPABASE_KEY=$SUPABASE_KEY \
            workload-backend:${{ github.sha }}
          for i in $(seq 1 15); do curl -sf localhost:8000/health && break; sleep 1; done
          docker stop backend

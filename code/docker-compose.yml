# Local backend stack: the API plus a Postgres for schema work.
#   cp .env.example .env            # fill in Supabase values
#   docker compose up --build       # API on http://localhost:8000
#   docker compose run --rm api python scripts/init_db.py   # create tables
services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg2://balancer:balancer@db:5432/balancer
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: balancer
      POSTGRES_PASSWORD: balancer
      POSTGRES_DB: balancer
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U balancer -d balancer"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
